<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Semantic Graph — 语义回想</title>

  <!-- 装到主屏幕后是独立窗口，且已安装的 PWA 在 Chrome 里更容易拿到
       持久化存储配额 —— 记忆进度存在 localStorage，磁盘紧张时不希望被回收。
       菜单里的「添加到主屏幕」自 Chrome 108（移动端）起不再需要 service worker，
       所以这里只有 manifest。仍需要 fetch handler 的是那个自动弹出的安装提示。 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fffaf2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191d25" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- iOS 不读 manifest 的 display / icons，得靠这几个私有标签。
       注意 iOS Safari 未安装时会在 7 天无交互后清除 localStorage（ITP），
       加到主屏幕才豁免 —— 这也是提供 apple-touch-icon 的实际理由。 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="语义图谱">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="style.css">
  <script>
    // 提前应用主题，避免首屏闪白
    (function () {
      try {
        var saved = localStorage.getItem("esg-theme");
        var night = saved
          ? saved === "night"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (night) document.documentElement.setAttribute("data-theme", "night");
      } catch (e) { /* localStorage 不可用时用默认白天主题 */ }
    })();
  </script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <h1>English Semantic Graph</h1>
      <span class="badge">v0.4.0 · paper atlas</span>
    </div>
    <p class="subtitle">从画面回想单词，再看它如何长成词族</p>
    <div class="header-tools">
      <div id="mode-switch" role="tablist" aria-label="学习模式">
        <button class="mode-btn" data-mode="explore" role="tab">关系地图</button>
        <button class="mode-btn active" data-mode="recall" role="tab">回想卡</button>
        <button class="mode-btn" data-mode="family" role="tab">词族</button>
      </div>
      <div id="search-box">
        <input type="text" id="search-input" placeholder="搜索单词 / 词根 / 中文…" autocomplete="off">
        <div id="search-results" class="hidden"></div>
      </div>
      <button id="theme-toggle" type="button" title="切换白天 / 夜间" aria-label="切换白天 / 夜间">☾</button>
    </div>
  </header>

  <!-- 学习模式面板：与图谱互斥显示 -->
  <section id="study">
    <div id="study-inner">
      <div id="study-progress"></div>
      <div id="study-card"></div>
      <div id="study-actions"></div>
    </div>
  </section>

  <main>
    <div id="graph-container">
      <svg id="graph"></svg>
      <div id="load-progress" role="status" aria-live="polite">正在加载词库…</div>
      <!-- 钻取导航：回退 + 当前位置。第一层隐藏，内容由 graph.js 填充。
           父节点不再画在画面上，这里是"我在哪"的唯一交代。 -->
      <div id="nav-bar" class="hidden" role="navigation" aria-label="层级导航"></div>
      <div id="legend">
        <div class="legend-item"><span class="dot domain"></span>语义域 Domain</div>
        <div class="legend-item"><span class="dot root"></span>词根 Root</div>
        <div class="legend-item"><span class="dot concept"></span>核心概念 Concept</div>
        <div class="legend-item"><span class="dot word"></span>单词 Word</div>
        <div class="legend-item"><span class="dot derived"></span>派生/词根关系</div>
        <div class="legend-item"><span class="dot antonym"></span>反义关系</div>
      </div>
      <div id="hint">点击语义域展开词根，再点词根展开词族 · 双击空白重新布局</div>
    </div>

    <aside id="detail-panel">
      <div id="drawer-handle">
        <div class="drawer-grip"></div>
        <button id="drawer-close" title="关闭">×</button>
      </div>
      <div id="detail-empty">
        <p>点击语义域开始探索</p>
        <p>语义域 → 词根 → 单词，逐层展开</p>
      </div>
      <div id="detail-content" class="hidden"></div>
    </aside>
  </main>

  <footer>
    <p>数据驱动：<code>data/roots.json</code> · <code>data/concepts.json</code> · <code>data/words.json</code> · <code>data/relations.json</code></p>
  </footer>

  <script src="study.js"></script>
  <script src="graph.js"></script>
</body>
</html>
