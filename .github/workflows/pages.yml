name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate data files
        run: |
          python3 tests/validate.py

      - name: Install playwright
        run: pip install playwright

      # Chromium 约 150MB，不缓存则每次构建都重新下载，是最慢的一步
      - name: Cache playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install chromium
        run: playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      # 缓存命中时浏览器已在，但系统依赖库仍需安装
      - name: Install chromium system deps
        run: playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - name: Visual audit (contrast / overlap / clipping)
        run: |
          python3 tests/visual_audit.py

      # 性能冒烟：验证并行加载 + IndexedDB 缓存（首次渲染、二次访问命中缓存）
      - name: Perf smoke test (parallel load + cache)
        run: |
          python3 -m http.server 8123 >/tmp/httpserv.log 2>&1 &
          SRV=$!
          sleep 1
          python3 tests/smoke_perf.py http://127.0.0.1:8123/frontend/ || { kill $SRV; exit 1; }
          kill $SRV

      # 部署时重新生成版本文件：数据任一变化 → 哈希变化 → 前端缓存自动失效。
      # 提交的 data/version.json 仅作仓库内的默认值，线上永远以这里生成的为准。
      - name: Generate data version file
        run: |
          python3 scripts/make_version.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4